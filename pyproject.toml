[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq"
version = "0.1.0"
description = "Zero to two evidence-backed coaching conversations for a pull request"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qq = "qq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qq*"]

[tool.setuptools.package-data]
qq = ["examples/*.json"]
